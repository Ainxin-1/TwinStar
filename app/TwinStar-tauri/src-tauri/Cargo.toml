[package]
name = "twinstar"
version = "0.10.0"
description = "TwinStar — 零成本互传"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# unstable-net-report：拿 net_report 的 UDP/NAT 探测结果做网络自检
iroh = { version = "1.1.0", features = ["unstable-net-report"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
rfd = "0.17"

# ---- 密码学（设备身份与密钥派生；传输加密由 iroh TLS 1.3 承担）----
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
hkdf = "0.12"
hex = "0.4"
dirs = "5"
base64 = "0.22"

[features]
custom-protocol = ["tauri/custom-protocol"]
