[package]
name = "twinstar"
version = "0.12.0"
description = "TwinStar — 零成本互传"
edition = "2021"

[lib]
# 移动端要求 cdylib/staticlib；桌面沿用 rlib。名称带 _lib 避免与 bin 撞名。
name = "twinstar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 单实例守护：二次启动时通知首实例聚焦已有窗口，第二进程自动退出（仅桌面）
tauri-plugin-single-instance = "2"
# 系统文件选择对话框：安卓构建必需（桌面文件选择走 rfd）
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# unstable-net-report：拿 net_report 的 UDP/NAT 探测结果做网络自检
iroh = { version = "1.1.0", features = ["unstable-net-report"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"

# ---- 密码学（设备身份与密钥派生；传输加密由 iroh TLS 1.3 承担）----
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
hkdf = "0.12"
hex = "0.4"
dirs = "5"
base64 = "0.22"

# rfd 没有移动端实现，桌面（Windows/macOS/Linux）专用；安卓走 tauri-plugin-dialog。
# 注意：target 表之后不能再放全平台依赖（TOML 表头吞键）。
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.17"

[features]
custom-protocol = ["tauri/custom-protocol"]
